name: Build Android App Bundle & APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Android App Bundle (AAB) & APK
      env:
        JAVA_TOOL_OPTIONS: "--add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED"
      run: |
        ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace || gradle :app:bundleRelease :app:assembleRelease --stacktrace

    - name: Upload AAB Bundle Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-bundle
        path: |
          app/build/outputs/bundle/release/*.aab
          app/build/outputs/apk/release/*.apk
